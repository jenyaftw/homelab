apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-pihole
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.16.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: infra
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    nameOverride: external-dns-pihole
    sources: ["service", "ingress"]
    provider:
      name: rfc2136
    key: password
    policy: upsert-only
    registry: noop
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: pihole-secret
            key: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    extraArgs:
      - --rfc2136-host=192.168.0.40  # Technitium DNS IP
      - --rfc2136-port=53
      - --rfc2136-zone=${BASE_DOMAIN}       # DNS Zone
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-keyname=external-dns # TSIG Key Name
      - --rfc2136-tsig-axfr
      - --target-net-filter=192.0.0.0/8
    resources:
      requests:
        cpu: 25m
        memory: 50Mi
      limits:
        cpu: 50m
        memory: 50Mi
