apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-technitium
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.16.1
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: infra
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    nameOverride: external-dns-technitium
    sources: ["service", "ingress"]
    provider:
      name: rfc2136
    key: password
    policy: upsert-only
    registry: noop
    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: technitium-secret
            key: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    extraArgs:
      - --rfc2136-host=technitium-dns.apps.svc.cluster.local  # Technitium DNS IP
      - --rfc2136-port=53
      - --rfc2136-zone=${BASE_DOMAIN}       # DNS Zone
      - --rfc2136-tsig-secret-alg=hmac-sha256
      - --rfc2136-tsig-keyname=external-dns # TSIG Key Name
      - --rfc2136-tsig-axfr
      - --target-net-filter=10.0.10.0/24
    resources:
      requests:
        cpu: 25m
        memory: 50Mi
      limits:
        cpu: 50m
        memory: 50Mi
