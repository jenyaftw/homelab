apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: cloudflared-tunnel
  annotations:
    external-dns.alpha.kubernetes.io/target: external.jenya.lol
spec:
  endpoints:
    - dnsName: external.jenya.lol
      recordType: CNAME
      targets: ["${CLOUDFLARE_TUNNEL_ID}.cfargotunnel.com"]
