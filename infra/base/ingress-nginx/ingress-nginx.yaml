apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: infra
      interval: 12h
  values:
    controller:
      service:
        type: "ClusterIP"
        annotations:
          tailscale.com/expose: "true"
      allowSnippetAnnotations: true
    admissionWebhooks:
      enabled: false
