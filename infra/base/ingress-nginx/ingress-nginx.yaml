apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: infra
      interval: 12h
  values:
    controller:
      electionID: internal-ingress-controller-leader
      service:
        type: "LoadBalancer"
      allowSnippetAnnotations: true
    admissionWebhooks:
      enabled: false
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-public
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: infra
      interval: 12h
  values:
    controller:
      electionID: public-ingress-controller-leader
      ingressClass: public-nginx # default: nginx
      ingressClassResource:
        name: public-nginx # default: nginx
        enabled: true
        default: false
        controllerValue: "k8s.io/public-ingress-nginx"
      service:
        type: "LoadBalancer"
        loadBalancerIP: "${CLUSTER_IP}"
        ports:
          http: 8080
          https: 8443
        targetPorts:
          http: 80
          https: 443
      allowSnippetAnnotations: true
    admissionWebhooks:
      enabled: false
