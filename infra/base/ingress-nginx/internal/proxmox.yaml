apiVersion: v1
kind: Service
metadata:
  name: proxmox-service
  namespace: default
spec:
  ports:
  - port: 8006
    targetPort: 8006
    protocol: TCP
  type: ExternalName
  externalName: 192.168.0.2
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: proxmox-ingress
  namespace: infra
spec:
  ingressClassName: nginx
  rules:
  - host: proxmox.jenya.lol
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: proxmox-service
            port:
              number: 8006
  tls:
  - hosts:
    - proxmox.jenya.lol
    secretName: jenya.lol
