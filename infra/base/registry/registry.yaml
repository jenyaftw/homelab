apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: registry
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: docker-registry
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: twuni
        namespace: infra
      interval: 12h
  values:
    secrets:
      htpasswd: ${registryHtpasswd}
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: &host "docker.${BASE_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: ${BASE_DOMAIN}
          hosts:
            - *host
