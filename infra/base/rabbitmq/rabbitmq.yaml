apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rabbitmq
  namespace: infra
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: rabbitmq
      version: "15.3.1"
      sourceRef:
        kind: HelmRepository
        name: bitnami
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    auth:
      username: jenya
      updatePassword: true
      existingPasswordSecret: rabbitmq-secret
      existingSecretPasswordKey: rabbitPassword

    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: &host "rabbitmq.${BASE_DOMAIN}"
      extraTls:
        - secretName: ${BASE_DOMAIN}
          hosts:
            - *host
