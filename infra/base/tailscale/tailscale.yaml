apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.80.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: infra
  values:
    operatorConfig:
      hostname: "tailscale-operator"
      defaultTags:
        - "tag:k8s"
    apiServerProxyConfig:
      mode: "true"
  valuesFrom:
    - kind: Secret
      name: tailscale-secret
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-secret
      valuesKey: client_secret
      targetPath: oauth.clientSecret
