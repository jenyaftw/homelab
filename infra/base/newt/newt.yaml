apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: newt 
  namespace: infra
spec:
  interval: 1h
  chart:
    spec:
      chart: app-template
      version: "3.6.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      newt:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: fosrl/newt
              tag: 1.1.3
            env:
              PANGOLIN_ENDPOINT:
                valueFrom:
                  secretKeyRef:
                    name: newt-credentials
                    key: PANGOLIN_ENDPOINT
              NEWT_ID:
                valueFrom:
                  secretKeyRef:
                    name: newt-credentials
                    key: NEWT_ID
              NEWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: newt-credentials
                    key: NEWT_SECRET
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
