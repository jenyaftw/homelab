apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: newt-dns
  annotations:
    external-dns.alpha.kubernetes.io/target: external.jenya.lol
    external-dns.alpha.kubernetes.io/external: 'true'
    external-dns.alpha.kubernetes.io/cloudflare-proxied: 'false'
spec:
  endpoints:
    - dnsName: external.jenya.lol
      recordType: A
      targets: ["${VPS_IP}"]
