apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: arc-orchard-set
  namespace: infra
spec:
  interval: 30m
  chart:
    spec:
      chart: actions-runner-controller-charts/gha-runner-scale-set
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: gh-actions
        namespace: infra
      interval: 12h
  values:
    githubConfigUrl: https://github.com/jenyaftw/orchard-bot
    githubConfigSecret: github-secret
