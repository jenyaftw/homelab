apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: metallb-install
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infra/metallb/config
  prune: true
  wait: true
  timeout: 5m0s
  decryption:
    provider: sops
    secretRef:
      name: sops-age
