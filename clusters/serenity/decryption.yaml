---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: decryption
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
    postBuild:
      substitute: {}
      substituteFrom:
        - kind: ConfigMap
          name: cluster-config
        - kind: Secret
          name: cluster-secret
