apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchard-bot
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchard-bot
  template:
    metadata:
      labels:
        app: orchard-bot
    spec:
      # Init container to generate the processed config file
      initContainers:
        - name: config-init
          image: alpine:3.18
          envFrom:
            - secretRef:
                name: orchard-bot-secret
          volumeMounts:
            # Mount the ConfigMap with the original config (read-only)
            - name: config-map
              mountPath: /config/original
            # Mount a writable emptyDir for the processed config
            - name: config-out
              mountPath: /config/out
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache gettext &&
              cp /config/original/config.toml /config/out/config.toml &&
              envsubst < /config/out/config.toml > /config/out/config.toml
              cat /config/out/config.toml
      containers:
        - name: orchard-bot
          image: ghcr.io/jenyaftw/orchard-bot:latest
          envFrom:
            - secretRef:
                name: orchard-bot-secret
          volumeMounts:
            # Mount the processed configuration file at the expected location (/config.toml)
            - name: config-out
              mountPath: /config.toml
              subPath: config.toml
          command: ["/orchard-bot"]
      imagePullSecrets:
        - name: ghcr-jenyaftw
      volumes:
        # This volume mounts the ConfigMap as a read-only source
        - name: config-map
          configMap:
            name: orchard-bot-config
        # Writable volume to hold the processed config file
        - name: config-out
          emptyDir: {}
