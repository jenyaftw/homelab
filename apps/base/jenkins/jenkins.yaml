apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jenkins
  namespace: apps
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: jenkins
      version: "5.8.13"
      sourceRef:
        kind: HelmRepository
        name: jenkins
      interval: 5m
  releaseName: jenkins
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    storageClass: jenkins-pv
    serviceAccount:
      create: false
      # Service account name is autogenerated by default
      name: jenkins
      annotations: {}

    controller:
      ingress:
        enabled: true
        className: nginx
        hosts:
          - host: &host "jenkins.${BASE_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: ${BASE_DOMAIN}
            hosts:
              - *host
