apiVersion: v1
kind: PersistentVolume
metadata:
  name: jellyfin-media-pv
  namespace: apps
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/data/media"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-media-pvc
  namespace: apps
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4Ti
  volumeName: jellyfin-media-pv
