apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app technitium
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.6.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      interval: 5m
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      technitium:
        containers:
          technitium:
            image:
              repository: technitium/dns-server
              tag: 13.6.0
            env:
              DNS_SERVER_DOMAIN: "${BASE_DOMAIN}"
            resources:
              requests:
                cpu: 10m
                memory: 300Mi
              limits:
                memory: 1000Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            
    service:
      technitium:
        controller: *app
        ports:
          http:
            port: 5380
      dns:
        type: LoadBalancer
        controller: *app
        ports:
          dns-tcp:
            enabled: true
            port: 53
            protocol: TCP
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP

    ingress:
      technitium:
        enabled: true
        className: nginx
        hosts:
          - host: &host technitium.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: technitium
                  port: http
        tls:
          - secretName: ${BASE_DOMAIN}
            hosts:
              - *host

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /etc/dns
