apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: apps
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: jellyfin
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
      interval: 5m
  releaseName: jellyfin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    ingress:
      enabled: true
      className: nginx
      hosts:
        - host: &host "jellyfin.${BASE_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: ${BASE_DOMAIN}
          hosts:
            - *host

    persistence:
      media:
        type: hostPath
        mountPath: /media
        hostPath: /data/media
