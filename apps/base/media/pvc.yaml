apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-pv
  namespace: apps
  labels:
    type: nfs
spec:
  storageClassName: manual
  capacity:
    storage: 4.5Ti
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.0.10.4
    path: "/export/media/data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: apps
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4.5Ti
  volumeName: data-pv
