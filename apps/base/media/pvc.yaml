apiVersion: v1
kind: PersistentVolume
metadata:
  name: data-pv
  namespace: apps
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 4Ti
  accessModes:
    - ReadWriteMany
  hostPath:
    path: "/data"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: apps
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 4Ti
  volumeName: data-pv
