apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: apps
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: app-template
      version: "3.6.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      interval: 5m
  releaseName: sabnzbd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    containers:
      main:
        image:
          repository: ghcr.io/onedr0p/sabnzbd
          tag: 4.4.1@sha256:b7380cd5a93a0a232c5ce25803531b1575453953e99de4e6b8a1398e73442e5b
        env:
          SABNZBD__HOST_WHITELIST_ENTRIES: &host sab.${BASE_DOMAIN}

    persistence:
      config:
        enabled: true

      downloads:
        enabled: true
        existingClaim: data-pvc
        subPath: usenet

    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        hosts:
          - host: *host
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: ${BASE_DOMAIN}
            hosts:
              - *host
