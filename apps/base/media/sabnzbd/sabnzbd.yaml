apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
  namespace: apps
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: sabnzbd
      version: "9.4.2"
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
      interval: 5m
  releaseName: sabnzbd
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    env:
      TZ: Europe/Kyiv
      HOST_WHITELIST_ENTRIES: &host sab.${BASE_DOMAIN}

    image:
      repository: lscr.io/linuxserver/sabnzbd
      tag: version-4.4.1

    persistence:
      config:
        enabled: true

      downloads:
        enabled: true
        existingClaim: data-pvc
        subPath: usenet

    ingress:
      main:
        enabled: true
        ingressClassName: nginx
        hosts:
          - host: *host
            paths:
              - path: /
                pathType: Prefix
        tls:
          - secretName: ${BASE_DOMAIN}
            hosts:
              - *host
