apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app odoo
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: uninstall
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      odoo:
        type: deployment
        containers:
          odoo:
            image:
              repository: docker.io/odoo
              tag: 18.0-20250606
            envFrom:
              - secretRef:
                  name: odoo-secrets
    service:
      main:
        controller: odoo
        type: ClusterIP
        ports:
          http:
            port: 8069
    ingress:
      main:
        enabled: true
        className: public-nginx
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${BASE_DOMAIN}"
          external-dns.alpha.kubernetes.io/external: true
        hosts:
          - host: &host "odoo.${BASE_DOMAIN}"
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
            - *host
    persistence:
      config:
        existingClaim: odoo-config
        globalMounts:
         - path: /var/lib/odoo
      etc-config-file:
        type: configMap
        name: odoo-configmap
        globalMounts:
          - path: /etc/odoo/odoo.conf
            subPath: odoo.conf
      extra-addons:
        existingClaim: odoo-addons-v1
        globalMounts:
          - path: /mnt/extra-addons
