apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: odoo
  namespace: apps
spec:
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: odoo
      version: "28.2.6"
      sourceRef:
        kind: HelmRepository
        name: odoo
        namespace: apps
      interval: 5m
  releaseName: odoo
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    odooUsername: Jenya
    odooEmail: me@${BASE_DOMAIN}
    
    persistence:
      enabled: true
      size: 10Gi
      
    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: &host "odoo.${BASE_DOMAIN}"
      tls: true
      extraTls:
        - secretName: ${BASE_DOMAIN}
          hosts:
            - *host
            
    resources:
      limits:
        memory: 2048Mi
      requests:
        cpu: 300m
        memory: 512Mi
