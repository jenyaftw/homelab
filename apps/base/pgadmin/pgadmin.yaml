apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: apps
spec:
  interval: 10m
  timeout: 5m
  chart:
    spec:
      chart: pgadmin4
      version: "1.35.0"
      sourceRef:
        kind: HelmRepository
        name: runix
      interval: 5m
  releaseName: pgadmin
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  test:
    enable: true
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/spec/replicas"]
        target:
          kind: Deployment
  values:
    replicaCount: 10
    ingress:
      enabled: true
      ingressClassName: nginx
      hosts:
        - host: &host "pgadmin.${BASE_DOMAIN}"
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: ${BASE_DOMAIN}
          hosts:
            - *host
