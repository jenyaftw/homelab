apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app netboot
  namespace: apps
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: "3.6.1"
      sourceRef:
        kind: HelmRepository
        name: bjw-s
      interval: 5m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      netboot:
        containers:
          app:
            image:
              repository: ghcr.io/netbootxyz/netbootxyz
              tag: 0.7.6-nbxyz4
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
    service:
      app:
        controller: *app
        ports:
          control:
            port: &port 3000
          tftp:
            port: 69
            protocol: UDP
          http:
            port: 80

    ingress:
      internal:
        enabled: true
        className: nginx
        hosts:
          - host: &host netboot.${BASE_DOMAIN}
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: app
                  port: *port
        tls:
          - secretName: ${BASE_DOMAIN}
            hosts:
              - *host

    persistence:
      config:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config

      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

      assets:
        type: emptyDir
        globalMounts:
          - path: /assets

      nginx-logs:
        type: emptyDir
        globalMounts:
          - path: /var/lib/nginx/logs

      nginx-tmp:
        type: emptyDir
        globalMounts:
          - path: /var/lib/nginx/tmp

      var-tmp-nginx:
        type: emptyDir
        globalMounts:
          - path: /var/tmp/nginx
